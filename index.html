<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Campus Planner</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Smart Campus Planner</h1>
      <p class="app-subtitle">학과 · 아르바이트 · 개인 할 일을 한곳에서 관리하세요</p>
    </header>

    <!-- 할 일 추가 영역 (T2: 제목 + 카테고리 + 중요도 + 마감일) -->
    <section class="add-todo-section">
      <form id="todo-form" class="todo-form">
        <input
          type="text"
          id="todo-title-input"
          class="todo-title-input"
          placeholder="할 일을 입력하세요 (예: 자료구조 과제 제출)"
          autocomplete="off"
        />

        <div class="todo-form-options">
          <label class="todo-form-field">
            <span class="field-label">카테고리</span>
            <select id="todo-category-select" class="todo-select">
              <option value="학과">학과</option>
              <option value="아르바이트">아르바이트</option>
              <option value="개인">개인</option>
            </select>
          </label>

          <label class="todo-form-field">
            <span class="field-label">중요도</span>
            <select id="todo-priority-select" class="todo-select">
              <option value="상">상</option>
              <option value="중" selected>중</option>
              <option value="하">하</option>
            </select>
          </label>

          <label class="todo-form-field">
            <span class="field-label">마감일</span>
            <input type="date" id="todo-due-date-input" class="todo-date-input" />
          </label>
        </div>

        <button type="submit" class="add-btn">추가</button>
      </form>
    </section>

    <!-- 전체 완료율 표시 영역 -->
    <section class="progress-section">
      <div class="progress-info">
        <span id="progress-text" class="progress-text">완료율: 0% (0/0)</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%"></div>
      </div>
    </section>

    <!-- 할 일 목록 영역 -->
    <section class="todo-list-section">
      <ul id="todo-list" class="todo-list"></ul>

      <!-- 할 일이 하나도 없을 때 보여줄 안내 문구 -->
      <p id="empty-state" class="empty-state">
        아직 등록된 할 일이 없습니다. 위에서 할 일을 추가해 보세요!
      </p>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
